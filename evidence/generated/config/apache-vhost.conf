# Document root is the app's public/ folder so PHP sources stay outside the
# web root. Directory listing is disabled and uploads are never served from disk.
ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@ftminna.edu.ng
    DocumentRoot /var/www/html/app/public

    <Directory /var/www/html/app/public>
        Options -Indexes -FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
