# The starter (vulnerable) application is a copy of the app so that both run
# from the same document root layout, but the code in /vulnerable is the
# deliberately insecure "before" version.
ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@ftminna.edu.ng
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
